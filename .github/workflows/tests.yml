name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # The extras in pyproject.toml, not requirements.txt: the web panel's
        # deps (fastapi, uvicorn, httpx) live only there, and tests/test_web_api.py
        # fails at import without them.
        run: pip install -e ".[test,web]"

      - name: Run tests
        run: pytest
