name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # The extras in pyproject.toml, not requirements.txt: the web panel's
        # deps (fastapi, uvicorn, httpx) live only there, and tests/test_web_api.py
        # fails at import without them.
        run: pip install -e ".[test,web]"

      - name: Run tests
        run: pytest

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4

      # vite 8 needs ^20.19 || >=22.12 and vitest 4 needs ^20 || ^22 || >=24;
      # 22 satisfies both with room to spare.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - run: npm ci

      # `build` is `tsc -b && vite build`, so this typechecks the tests too --
      # they are inside tsconfig's include and would otherwise only be checked
      # by whoever happened to run tsc locally. Output goes to web/static/,
      # which is gitignored.
      - run: npm run build

      - run: npm test
