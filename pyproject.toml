[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futurestoolkit"
version = "0.1.0"
description = "Self-built daily futures backtesting engine for Chinese commodity futures (CZCE, SHFE, DCE)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.1",
    "numpy==2.4.2",
    "matplotlib==3.10.8",
    "TA-Lib==0.7.1",
    "optuna==4.9.0",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
web = [
    "fastapi==0.121.3",
    "uvicorn[standard]==0.41.0",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["core", "datafeed", "strategies", "research", "meta", "live", "web"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
