[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futurestoolkit"
version = "0.1.0"
description = "Self-built daily futures backtesting engine for Chinese commodity futures (CZCE, SHFE, DCE)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.1",
    "numpy==2.4.2",
    "matplotlib==3.10.8",
    "TA-Lib==0.7.1",
    "scipy==1.17.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
web = [
    "fastapi==0.121.3",
    "uvicorn[standard]==0.41.0",
    "httpx==0.28.1",
]

# `find` rather than an explicit `packages` list: the list form does not
# recurse, so `web.routers` was absent from every built wheel and a non-editable
# install failed at `import web.app`. The include patterns keep the repo's
# non-package top-level directories (tests, webui, docs, data, cache, results)
# out, which is what the explicit list was buying.
[tool.setuptools.packages.find]
include = ["core*", "datafeed*", "strategies*", "research*", "web*"]

# The product registry is data, not code, so nothing sweeps it into the wheel on
# its own. `datafeed.products` reads it at *import* time, so a wheel without it
# does not degrade at first use -- `import datafeed.products` raises
# FileNotFoundError and every entry point in the project is dead.
[tool.setuptools.package-data]
datafeed = ["products.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
